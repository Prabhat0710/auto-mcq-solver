<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto MCQ Solver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
      </div>
      <div>
        <h1>Auto MCQ Solver</h1>
        <p class="subtitle">AI-Powered Quiz & Course Assistant</p>
      </div>
    </div>

    <!-- Active Backend Badge -->
    <div id="backendBadge" class="backend-badge">
      <span class="badge-dot"></span>
      <span id="backendBadgeText">Checking AI connection...</span>
    </div>

    <!-- Auto-Pilot Control Card -->
    <div class="autopilot-card">
      <div class="autopilot-header">
        <div class="autopilot-title">
          <span class="ap-icon">🚀</span>
          <div>
            <h3>Auto-Pilot Mode</h3>
            <p>Auto-solve, auto-submit & auto-advance</p>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="autoPilotToggle">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="autopilot-options">
        <div class="option-row">
          <span>🎬 Video Speed:</span>
          <select id="videoSpeedSelect">
            <option value="1">1x (Normal)</option>
            <option value="2" selected>2x (Fast)</option>
            <option value="4">4x (Super Fast)</option>
            <option value="8">8x (Extreme)</option>
            <option value="16">16x (Max)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Manual Actions -->
    <div class="section">
      <label class="label">Quick Actions</label>
      <button id="solveBtn" class="btn btn-primary btn-full btn-large">
        🧠 Solve Current Questions
      </button>
      <button id="nextBtn" class="btn btn-secondary btn-full" style="margin-bottom: 8px;">
        ➡️ Click Next / Submit
      </button>
      <div class="btn-row">
        <button id="extractBtn" class="btn btn-secondary">📋 Extract</button>
        <button id="videoBtn" class="btn btn-secondary">🎬 Transcript</button>
      </div>
    </div>

    <!-- Page Info -->
    <div class="section">
      <label class="label">Current Page Scan</label>
      <div id="pageInfo" class="page-info">
        <div class="info-row">
          <span>📄</span>
          <span id="pageTitle" class="info-text">Loading...</span>
        </div>
        <div class="info-row">
          <span>📝</span>
          <span id="questionCount" class="info-text">-</span>
        </div>
        <div class="info-row">
          <span>🎬</span>
          <span id="videoInfo" class="info-text">-</span>
        </div>
        <div class="info-row">
          <span>➡️</span>
          <span id="nextBtnInfo" class="info-text">-</span>
        </div>
      </div>
      <button id="refreshInfo" class="btn btn-secondary btn-full">🔄 Refresh Page Scan</button>
    </div>

    <hr class="divider">

    <!-- Collapsible Settings Section -->
    <details class="settings-details">
      <summary class="settings-summary">⚙️ AI Backend Settings</summary>
      
      <div class="settings-body">
        <!-- Cloudflare Proxy Setup -->
        <div class="setting-block">
          <label class="label">Cloudflare Worker Proxy (No Key Needed)</label>
          <div class="input-group">
            <input type="text" id="proxyUrl" placeholder="https://auto-mcq.<subdomain>.workers.dev" />
          </div>
          <div class="input-actions">
            <button id="saveProxy" class="btn btn-primary">Save Proxy</button>
            <button id="testProxy" class="btn btn-secondary">Test</button>
          </div>
          <div id="proxyStatus" class="status-msg" style="display:none;"></div>
        </div>

        <!-- Custom Gemini API Key -->
        <div class="setting-block" style="margin-top: 12px;">
          <label class="label">OR Custom Gemini API Key</label>
          <div class="input-group">
            <input type="password" id="apiKey" placeholder="Enter custom Gemini API key..." />
            <button id="toggleKey" class="btn-icon" title="Show/Hide">👁️</button>
          </div>
          <div class="input-actions">
            <button id="saveKey" class="btn btn-primary">Save Key</button>
            <button id="testKey" class="btn btn-secondary">Test</button>
          </div>
          <div id="keyStatus" class="status-msg" style="display:none;"></div>
          <a href="https://aistudio.google.com/apikey" target="_blank" class="help-link">
            🔑 Get free API key from Google AI Studio
          </a>
        </div>
      </div>
    </details>

    <!-- Footer -->
    <div class="footer">
      <p>Continuous Auto-Pilot • Powered by Gemini AI</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
